name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      # ── Step 1: Deploy the Node.js static file server ─────────────────────────
      # server/app.js is a self-contained HTTP server — no npm install needed.
      # It serves the Next.js static export from nodejs/public/.
      - name: Deploy server file to nodejs/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./server/
          server-dir: /nodejs/
          state-name: .ftp-server-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**

      # ── Step 2: Deploy the built static site to nodejs/public/ ────────────────
      # Media files (images/albums/, hero-bg.mp4) are uploaded manually via
      # Hostinger File Manager and are excluded here so they are never deleted.
      - name: Deploy static site to nodejs/public/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./out/
          server-dir: /nodejs/public/
          state-name: .ftp-deploy-sync-state-v3.json
          exclude: |
            **/.git*
            **/.git*/**
            **/hero-bg.mp4
            **/images/albums/**

      # ── Step 3: Restart the Node.js app to pick up new files ──────────────────
      - name: Restart Node.js app via Hostinger API
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.hpanel.hostinger.com/api/v1/nodejs/restart" \
            -H "Authorization: Bearer ${{ secrets.HOSTINGER_API_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "Hostinger API response: $RESPONSE"
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "204" ]; then
            echo "⚠️  Auto-restart returned $RESPONSE — restart manually in hPanel if site is down"
          else
            echo "✅ Node.js app restarted successfully"
          fi
