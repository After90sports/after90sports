name: CI

# Hostinger auto-deploys from GitHub on every push to main.
# This workflow verifies the build passes before Hostinger picks it up.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # matches Hostinger runtime
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
